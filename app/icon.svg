<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 6 46 46">
  <!-- Brick City Grove: two stacked bricks. Next.js uses this as the browser tab icon. -->
  <!-- Bottom brick -->
  <polygon points="10,33 36,33 46,27 20,27" fill="#f5894a" />
  <polygon points="10,33 36,33 36,45 10,45" fill="#d2531a" />
  <polygon points="36,33 46,27 46,39 36,45" fill="#6b3f33" />
  <!-- Shadow the top brick casts on the bottom one -->
  <polygon points="16,31 44,31 36,33 14,33" fill="#3b2019" opacity="0.55" />
  <!-- Top brick -->
  <polygon points="18,19 44,19 54,13 28,13" fill="#f5894a" />
  <polygon points="18,19 44,19 44,31 18,31" fill="#d2531a" />
  <polygon points="44,19 54,13 54,25 44,31" fill="#6b3f33" />
</svg>
